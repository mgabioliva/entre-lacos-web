<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre laços & nós</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/} + ${tema} + '.css'">
</head>

<body>

    <header class="cabecalho">
        <input type="hidden" id="usuarioId" th:value="${usuarioId}">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="logo">entre laços & nós</h1>
            <a th:href="@{/tema/claro}" class="btn-menu">☀️ claro</a>
            <a th:href="@{/tema/escuro}" class="btn-menu">🌙 escuro</a>
            <a th:href="@{/logoff}" class="btn-menu">sair da conta, tchau tchau</a>
        </div>
    </header>

    <div class="container">
        <div class="row">

            <div class="col-sm-3">
                <div class="menu-lateral">
                    <button type="button" class="btn-menu ativo" data-aba="home">home🏠</button>
                    <button type="button" class="btn-menu" data-aba="receitas">receitas📖</button>
                    <button type="button" class="btn-menu" data-aba="projetos">projetos🧩</button>
                    <button type="button" class="btn-menu" data-aba="config">configurações⚙️</button>
                </div>
            </div>

            <div class="col-sm-9">

                <input type="search" id="pesquisa" class="campo-pesquisa" placeholder="🔍 pesquisar por título, autor ou conteúdo">

                <div id="home" class="aba">
                    <h2 class="titulo-aba">home</h2>
                    <div id="feedHome"></div>
                </div>

                <div id="receitas" class="aba" hidden>
                    <h2 class="titulo-aba">receitas</h2>
                    <a th:href="@{/criarReceitaForm}" class="btn-adicionar">+ nova receita</a>
                    <div id="feedReceitas"></div>
                </div>

                <div id="projetos" class="aba" hidden>
                    <h2 class="titulo-aba">projetos</h2>
                    <a th:href="@{/criarProjetoForm}" class="btn-adicionar">+ novo projeto</a>
                    <div id="feedProjetos"></div>
                </div>

                <div id="config" class="aba" hidden>
                    <h2 class="titulo-aba">configurações</h2>
                    <a th:href="@{/atualizarUsuarioForm/{id}(id=${usuarioId})}" class="btn-menu">👤 editar perfil</a>
                    <a th:href="@{/tema/claro}" class="btn-menu">☀️ claro</a>
                    <a th:href="@{/tema/escuro}" class="btn-menu">🌙 escuro</a>
                    <a th:href="@{/logoff}" class="btn-menu">sair da conta, tchau tchau</a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script th:src="@{/js/comum.js}"></script>
    <script th:src="@{/js/tela-inicial.js}"></script>
</body>

</html>
